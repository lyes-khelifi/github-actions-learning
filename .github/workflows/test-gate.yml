name: Test Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run unit tests
        run: mvn -B package -DskipITs -Dgroups=unit -Dmaven.test.failure.ignore=true

      - name: Run SpotBugs
        if: always()
        run: mvn spotbugs:check

      - name: Run JaCoCo Code Coverage
        if: always()
        run: mvn jacoco:report

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Generate Serenity HTML report
        if: always()
        run: mvn serenity:aggregate

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: serenity-report
          path: target/site/serenity/
          retention-days: 1

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 1

  check-pass-rate:
    name: check-pass-rate
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Surefire reports
        uses: actions/download-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Check test pass rate (>= 80% required)
        run: |
          python3 << 'EOF'
          import glob, xml.etree.ElementTree as ET, sys

          total = failures = errors = 0
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(f).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))

          passed = total - failures - errors
          rate = (passed * 100 // total) if total > 0 else 0
          print(f"Tests: {passed}/{total} passed ({rate}%)")

          if rate < 80:
              print(f"ERROR: pass rate {rate}% is below the 80% threshold — PR blocked")
              sys.exit(1)

          print(f"Pass rate {rate}% meets the 80% threshold — PR can be merged")
          EOF

  publish-report:
    name: publish-report
    needs: build-and-test
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Serenity report
        uses: actions/download-artifact@v5
        with:
          name: serenity-report
          path: serenity-report/

      - name: Deploy unit-test report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: serenity-report/
          destination_dir: unit-tests
          keep_files: true

