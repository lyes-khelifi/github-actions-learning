name: Regression Tests

on:
  schedule:
    - cron: '0 13 * * *'  # 8:00 AM EST (UTC-5)
  workflow_dispatch:       # allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run regression tests
        run: mvn -B test -Dgroups=regression -Dmaven.test.failure.ignore=true

      - name: Generate Serenity HTML report
        if: always()
        run: mvn serenity:aggregate

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-serenity-report
          path: target/site/serenity/
          retention-days: 30

  publish-report:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Serenity report
        uses: actions/download-artifact@v4
        with:
          name: regression-serenity-report
          path: serenity-report/

      - name: Deploy regression report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: serenity-report/
          destination_dir: regression
          keep_files: true
